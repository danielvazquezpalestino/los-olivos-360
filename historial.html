<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial de llamadas | Residencia Los Olivos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="historial.css">
</head>

<body>
  <div class="container">
    <div class="header-actions">
      <h1>Historial de videollamadas</h1>
      <div class="acciones-top">
        <a href="index.html" class="btn btn-outline">← Volver al inicio</a>
        <button id="logoutBtn" class="btn btn-outline" type="button">Cerrar sesión</button>
      </div>
    </div>

    <p class="nota">
      Las horas se muestran en tu zona horaria local. Los tiempos los registra el servidor de vídeo,
      así que son válidos aunque cierres el navegador.
    </p>

    <div id="estado" class="estado" role="status" aria-live="polite"></div>

    <div class="tabla-wrap">
      <table id="tabla">
        <thead>
          <tr>
            <th scope="col">Sala</th>
            <th scope="col">Fecha</th>
            <th scope="col">Inicio</th>
            <th scope="col">Fin</th>
            <th scope="col">Duración</th>
            <th scope="col">Participantes</th>
            <th scope="col">Estado</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="cuerpo">
        </tbody>
      </table>
    </div>

    <nav class="paginacion" id="paginacion" aria-label="Paginación del historial" hidden>
      <button id="btnAnterior" class="btn btn-outline" type="button">← Anteriores</button>
      <span id="paginaInfo" class="pagina-info"></span>
      <button id="btnSiguiente" class="btn btn-outline" type="button">Siguientes →</button>
    </nav>
  </div>

  <!-- Detalle de una llamada -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <h2 id="modalTitulo">Detalle de la llamada</h2>
      <div id="modalContenido"></div>
      <div class="modal-acciones">
        <button type="button" class="btn btn-outline" id="btnCerrarModal">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="historial.js"></script>
</body>

</html>
